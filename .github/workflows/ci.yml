name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Lint & compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check scrape_script

      - name: Byte-compile
        run: python -m compileall scrape_script
